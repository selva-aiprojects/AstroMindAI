version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: astra-postgres
    environment:
      POSTGRES_DB: astra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astra-network

  # Chroma Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: astra-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - astra-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: astra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - astra-network

  # Backend Application
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: astra-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/astra_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CHROMA_DB_HOST: chroma
      CHROMA_DB_PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - chroma
      - redis
    networks:
      - astra-network

networks:
  astra-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  redis_data:
