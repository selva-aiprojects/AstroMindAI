<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#1A1A2E"/>
  
  <!-- Gradient Circle -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B21A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#087E8B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="256" cy="256" r="180" fill="url(#grad1)" opacity="0.3"/>
  
  <!-- Zodiac Ring -->
  <circle cx="256" cy="256" r="160" stroke="#E0A640" stroke-width="4" stroke-dasharray="16 8"/>
  
  <!-- Central Celestial Body -->
  <circle cx="256" cy="256" r="60" fill="#6B21A8"/>
  <circle cx="256" cy="256" r="40" fill="#E0A640"/>
  <circle cx="256" cy="256" r="20" fill="#087E8B"/>
  
  <!-- Orbital Paths -->
  <ellipse cx="256" cy="256" rx="100" ry="45" stroke="#087E8B" stroke-width="4" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="100" ry="45" stroke="#E0A640" stroke-width="4" transform="rotate(30 256 256)"/>
  
  <!-- Planets -->
  <circle cx="140" cy="180" r="20" fill="#E0A640"/>
  <circle cx="372" cy="180" r="15" fill="#087E8B"/>
  <circle cx="256" cy="100" r="12" fill="#6B21A8"/>
  <circle cx="256" cy="412" r="18" fill="#E0A640"/>
  <circle cx="180" cy="332" r="10" fill="#087E8B"/>
  <circle cx="332" cy="332" r="14" fill="#6B21A8"/>
  
  <!-- Stars/Sparkles -->
  <circle cx="80" cy="256" r="8" fill="#E0A640"/>
  <circle cx="432" cy="256" r="8" fill="#E0A640"/>
  <circle cx="256" cy="80" r="6" fill="#087E8B"/>
  <circle cx="256" cy="432" r="6" fill="#087E8B"/>
  <circle cx="120" cy="120" r="5" fill="#6B21A8"/>
  <circle cx="392" cy="120" r="5" fill="#6B21A8"/>
  <circle cx="120" cy="392" r="5" fill="#6B21A8"/>
  <circle cx="392" cy="392" r="5" fill="#6B21A8"/>
</svg>
