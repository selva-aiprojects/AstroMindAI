name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build with Maven
      run: |
        cd backend
        mvn clean compile
    
    - name: Run tests
      run: |
        cd backend
        mvn test
    
    - name: Build Docker image
      run: |
        docker build -t astra/backend:${{ github.sha }} -t astra/backend:latest backend/
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker push astra/backend:${{ github.sha }}
        docker push astra/backend:latest

  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
    
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f infrastructure/k8s/configmap.yaml
        kubectl apply -f infrastructure/k8s/secrets.yaml
        kubectl apply -f infrastructure/k8s/postgres-deployment.yaml
        kubectl apply -f infrastructure/k8s/chroma-deployment.yaml
        kubectl apply -f infrastructure/k8s/redis-deployment.yaml
        kubectl apply -f infrastructure/k8s/backend-deployment.yaml
        kubectl apply -f infrastructure/k8s/horizontal-pod-autoscaler.yaml
        kubectl apply -f infrastructure/k8s/ingress.yaml
    
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/astra-backend
        kubectl get pods -l app=astra-backend
