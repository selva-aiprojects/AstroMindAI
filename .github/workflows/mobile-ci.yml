name: Mobile CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: |
        cd mobile/astra_app
        flutter pub get
    
    - name: Analyze code
      run: |
        cd mobile/astra_app
        flutter analyze
    
    - name: Run tests
      run: |
        cd mobile/astra_app
        flutter test
    
    - name: Build Android APK
      run: |
        cd mobile/astra_app
        flutter build apk --release
    
    - name: Build iOS IPA
      if: false  # Disabled until macOS runner is available
      run: |
        cd mobile/astra_app
        flutter build ios --release
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: mobile/astra_app/build/app/outputs/flutter-apk/app-release.apk
    
    - name: Upload iOS IPA
      if: false
      uses: actions/upload-artifact@v3
      with:
        name: ios-ipa
        path: mobile/astra_app/build/ios/ipa/
