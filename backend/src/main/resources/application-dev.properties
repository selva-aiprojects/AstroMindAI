# Dev profile - H2 in-memory database, no external dependencies needed
spring.datasource.url=jdbc:h2:mem:astra_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Chroma vector DB initialization
chroma.db.host=localhost
chroma.db.port=8000

# Disable external services
swisseph.ephemeris.path=/ephemeris

# JWT for dev
jwt.secret=astra-dev-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# LLM API Keys (optional - will use fallback)
openai.api.key=
anthropic.api.key=
google.ai.api.key=
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.3-70b-versatile
