# Server Configuration
server.port=8080
spring.application.name=astromindai-backend
spring.profiles.active=dev

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/astra_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=astra-secret-key-change-in-production-minimum-256-bits
jwt.expiration=86400000



# Firebase Configuration
firebase.api-key=${FIREBASE_API_KEY:}

# LLM API Configuration
openai.api.key=${OPENAI_API_KEY:}
anthropic.api.key=${ANTHROPIC_API_KEY:}
google.ai.api.key=${GOOGLE_AI_API_KEY:}
groq.api.key=${GROQ_API_KEY:}

# Vector Database Configuration
chroma.db.host=localhost
chroma.db.port=8000

# Swiss Ephemeris Configuration
swisseph.ephemeris.path=/ephemeris

# Logging Configuration
logging.level.com.astra=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
